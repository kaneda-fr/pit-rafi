<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Point de contrôle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0B0B0D; --panel:#141417; --line:#26262B; --ink:#F3F1EA; --muted:#8E8E96;
  --accent:#FFD400; --accent-ink:#0B0B0D; --bad:#FF5A4E; --good:#5BE49B;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Barlow",system-ui,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding:0 16px;padding-block:32px 48px;min-height:100vh}
.wrap{max-width:460px;margin:0 auto}
.board{border:6px solid #2A2A2E;background:#000;padding:22px 16px 18px;position:relative;overflow:hidden}
.board::before,.board::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,#000 10px 20px)}
.board::before{top:-6px} .board::after{bottom:-6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,44px);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 2px;line-height:1;color:var(--ink);text-wrap:balance}
.sub{font-family:var(--display);font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-size:13px;margin:0 0 22px}
form{display:grid;gap:14px}
.f{display:grid;gap:6px}
label{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.lbl{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.line{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center}
.grp{display:flex;gap:3px;align-items:center}
.box{width:clamp(19px,4.9vw,28px);height:clamp(28px,7vw,36px);font:600 clamp(15px,4vw,20px)/1 var(--body);flex:none;text-align:center;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-bottom:2px solid var(--muted);border-radius:3px;padding:0;outline:none;caret-color:var(--accent)}
.box:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,212,0,.18)}
.fx{font-family:var(--display);font-weight:800;font-size:clamp(18px,5vw,24px);color:var(--accent);letter-spacing:.06em;padding:0 5px;line-height:1;white-space:nowrap}
.fx.sep{padding:0 3px;color:var(--muted)}
.gap{width:clamp(8px,2.4vw,14px)}
.grp.bad .box{border-color:var(--bad);color:var(--bad)}
.grp.ok .box{border-color:var(--good);color:var(--good);background:rgba(91,228,155,.08);pointer-events:none}
.grp .box{transition:color .15s,border-color .15s,background .15s}
button{margin-top:6px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.16em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button[disabled]{opacity:.35;cursor:not-allowed}
.msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--muted)}
.msg.bad{color:var(--bad)} 
.reveal{display:grid;gap:0;border-top:1px solid var(--line)}
.reveal .row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.reveal .k{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:14px}
.reveal .v{font-weight:600;font-size:18px;line-height:1.3}
.reveal .v.big{font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent);letter-spacing:.03em}
.note{margin:18px 0 20px;color:var(--ink);font-size:16px;line-height:1.45}
a.cta{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:14px;border-radius:3px}
a.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--display)}
@media (prefers-reduced-motion:no-preference){.board{animation:in .35s ease-out}@keyframes in{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:none}}}

#reveal[hidden]{display:none}
#reveal{opacity:0;transition:opacity .6s ease}
#reveal.in{opacity:1}
.hero{position:relative;background:#000;color:var(--ink);padding:0 16px;padding-block:56px 40px;overflow:hidden;border-bottom:4px solid var(--race)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 50% at 70% 40%,rgba(225,6,0,.22),transparent 70%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.hero .in{position:relative;max-width:960px;margin:0 auto;display:grid;gap:22px}
.kicker{font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--race);font-size:14px;margin:0}
.hero h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(44px,9vw,96px);line-height:.95;letter-spacing:.01em;margin:0;text-wrap:balance}
.hero p{font-size:clamp(17px,2.4vw,22px);max-width:60ch;margin:0;color:#D8D5CC;line-height:1.4}
.hero .carwrap{margin-top:10px}
.hero .carwrap svg{width:min(100%,720px);height:auto;display:block;margin-left:auto}
.strip{background:var(--race);color:#fff;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:15px;padding:10px 16px;overflow:hidden;white-space:nowrap}
.strip span{display:inline-block;padding-right:48px;animation:marquee 22s linear infinite}
@keyframes marquee{to{transform:translateX(-50%)}}
main{background:#F5F3EE;color:#121214;padding:0 16px;padding-block:40px 64px}
main .in{max-width:960px;margin:0 auto;display:grid;gap:44px}
section h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(26px,4vw,36px);margin:0 0 16px;color:#121214;border-left:6px solid var(--race);padding-left:14px;line-height:1}
.convo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid #D9D6CF;background:#fff}
.convo .row{padding:16px 18px;border-bottom:1px solid #E6E3DC;display:grid;gap:4px}
.convo .k{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#6B6B72}
.convo .v{font-weight:600;font-size:18px;line-height:1.3}
.convo .row.big .v{font-family:var(--display);font-weight:900;font-size:40px;color:var(--race);line-height:1;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat{background:#121214;color:var(--ink);padding:22px 20px;display:grid;gap:8px;border-top:4px solid var(--race)}
.stat .n{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;letter-spacing:.02em}
.stat .u{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:#B9B6AE;margin-top:-6px}
.stat .d{font-size:15px;line-height:1.4;color:#D8D5CC}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:16px;padding:10px 14px;border:2px solid #121214;background:#fff}
.ecurie{font-size:17px;line-height:1.55;max-width:70ch;margin:0;color:#2A2A2E}
.closing{background:#fff;border:1px solid #D9D6CF;padding:26px 22px;display:grid;gap:18px}
.closing .note{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em}
a.cta{display:inline-block;justify-self:start;text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase;background:var(--race);color:#fff;padding:16px 22px}
a.cta:hover{background:var(--race-dark)} a.cta:focus-visible{outline:3px solid #121214;outline-offset:2px}
footer{background:#000;color:var(--muted);text-align:center;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:18px 16px}

/* The birthday reveal starts only after the encrypted answers have been validated. */
[hidden]{display:none!important}
:root{--race:#f0005a;--race-dark:#b50044;--carbon:#000310;--ease:cubic-bezier(.22,1,.36,1)}
body.reveal-mode{padding:0;background:var(--carbon)}
body.is-launching{overflow:hidden}
.is-launching #checkpoint{opacity:0;transform:translateY(-8px);transition:opacity .65s ease,transform .65s ease}
#launch{position:fixed;inset:0;z-index:50;overflow:hidden;isolation:isolate;color:#fff;outline:none;opacity:0;transition:opacity .65s ease}
#launch.is-visible{opacity:1}
.launch-backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,#f0005a17,transparent 56%),#000310;transition:opacity 1.1s ease}
.launch-backdrop::after{content:"";position:absolute;left:0;right:0;top:50%;height:26%;background:radial-gradient(ellipse at center,#f0005a0c,transparent 65%);filter:blur(25px)}
.start-sequence{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:38px;padding:24px;transition:opacity .5s ease,transform .7s var(--ease)}
.start-eyebrow{font:500 11px var(--body);letter-spacing:.3em;text-transform:uppercase;margin:0;color:#8f93a6}
.start-title{font:800 clamp(36px,6vw,68px)/1 var(--display);text-transform:uppercase;letter-spacing:.035em;margin:0}
.start-lights{display:flex;gap:clamp(8px,2vw,20px);padding:clamp(12px,2.6vw,25px);position:relative;border:1px solid #343743;border-top-color:#555864;border-radius:8px;background:linear-gradient(#1a1c24,#0a0c13);box-shadow:0 28px 60px #0008}
.start-lights::before,.start-lights::after{content:"";position:absolute;top:calc(50% - 9px);width:18vw;height:18px;background:linear-gradient(#1e212c,#080a12);border-block:1px solid #2d303a;z-index:-1}
.start-lights::before{right:100%}.start-lights::after{left:100%}
.light-column{padding:7px;display:grid;gap:12px;border:1px solid #272934;border-radius:40px;background:#070910;box-shadow:inset 0 3px 5px #000}
.light-column i{display:block;width:clamp(27px,6.4vw,58px);aspect-ratio:1;border-radius:50%;background:#22070d;border:1px solid #351019;box-shadow:inset 0 2px 8px #000;position:relative}
.light-column i::after{content:"";position:absolute;inset:3px;border-radius:inherit;opacity:.2;background:radial-gradient(circle,#fff 0 1px,transparent 1.2px) 0 0/4px 4px}
.light-column.on i{background:#ff173d;border-color:#ff6673;box-shadow:0 0 26px #f0005a65,0 0 65px #f0005a28,inset 0 0 14px #ff787455}
.start-caption{font:500 10px var(--body);letter-spacing:.22em;text-transform:uppercase;color:#9195a8;margin:0}
.race-stage{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s ease}
.race-stage::before{content:"";position:absolute;inset:18% 5% 12%;background:radial-gradient(ellipse,#f0005a38,transparent 65%);opacity:.8}
.race-stage::after{content:"";position:absolute;top:32px;right:5vw;width:70px;height:10px;background:repeating-linear-gradient(115deg,var(--race) 0 12px,transparent 12px 19px);opacity:.85}
.race-wordmark{position:absolute;top:30px;left:5vw;font:800 20px var(--display);letter-spacing:.025em;font-style:italic;color:white;text-transform:uppercase}
.race-wordmark span{color:var(--race)}
.race-caption{position:absolute;left:0;right:0;bottom:10%;text-align:center;z-index:3;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform 1s var(--ease)}
.race-caption p{font:500 10px var(--body);letter-spacing:.25em;color:#aaadbd;text-transform:uppercase;margin:0 0 11px}
.race-caption h2{font:800 clamp(38px,6vw,72px)/.95 var(--display);letter-spacing:.025em;text-transform:uppercase;margin:0;color:#fff}
.race-caption h2 span{color:var(--race)}
.vehicle-frame{position:absolute;left:50%;top:47%;width:min(1100px,108vw);aspect-ratio:1086/840;transform:translate(-50%,-55%) scale(.72);transform-origin:50% 55%;will-change:transform;isolation:isolate;overflow:hidden}
.vehicle-frame img,.vehicle-silhouette{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 57%;display:block}
.vehicle-photo{opacity:0;transition:opacity 1.7s cubic-bezier(.4,0,.2,1);z-index:1}
.vehicle-silhouette{z-index:2;opacity:1;transition:opacity 1.45s ease;filter:brightness(0) drop-shadow(0 0 1px #ffc2d2) drop-shadow(0 0 22px #f0005a50)}
#launch.has-car .start-sequence{opacity:0;transform:translateY(-16px)}
#launch.has-car .race-stage{opacity:1}
#launch.has-photo .vehicle-photo{opacity:1}
#launch.has-photo .vehicle-silhouette{opacity:0}
#launch.has-photo .race-caption{opacity:1;transform:translateY(0)}
#launch.is-landing .launch-backdrop,#launch.is-landing .race-stage::before,#launch.is-landing .race-stage::after,#launch.is-landing .race-wordmark,#launch.is-landing .race-caption{opacity:0;transition:opacity .55s ease}
#launch.is-landing .vehicle-silhouette{display:none}
#launch.is-landing .vehicle-frame{will-change:auto}
.reveal-landing .hero-photo{visibility:hidden}
#reveal .hero .carwrap{position:relative;aspect-ratio:16/9;overflow:hidden;margin-top:10px;border:1px solid #ffffff25;background:#000310}
#reveal .hero-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 57%}
#reveal .hero{background:#000310}
#reveal .hero::before{background:radial-gradient(60% 50% at 70% 40%,#f0005a20,transparent 70%),repeating-linear-gradient(135deg,#ffffff06 0 2px,transparent 2px 14px)}
#reveal .hero h2:focus{outline:none}
#reveal .closing .note{color:#121214}
@media(max-width:600px){.start-sequence{gap:28px;padding:16px}.start-lights{padding:11px;gap:7px}.light-column{gap:9px;padding:5px}.start-caption{font-size:8px;letter-spacing:.16em}.vehicle-frame{width:135vw;top:47%}.race-caption{bottom:16%;padding:0 20px}.race-caption h2{font-size:clamp(34px,9.5vw,54px)}.race-wordmark{top:26px;font-size:17px}.race-stage::after{top:30px;width:50px;height:7px}}
@media(max-height:520px) and (min-width:600px){.start-sequence{gap:17px}.start-title{font-size:30px}.start-lights{padding:10px}.light-column{gap:7px;padding:5px}.light-column i{width:32px}.start-caption{font-size:8px}.race-wordmark{top:18px;font-size:16px}.race-stage::after{top:20px}.vehicle-frame{width:min(720px,80vw);top:45%}.race-caption{bottom:7%}.race-caption p{font-size:8px;margin-bottom:6px}.race-caption h2{font-size:34px}}
@media(prefers-reduced-motion:reduce){.is-launching #checkpoint{transform:none}#launch,.start-sequence,.race-stage,.vehicle-photo,.vehicle-silhouette,.race-caption{transition:none}.strip span{animation:none}.vehicle-frame{transform:translate(-50%,-55%)}#reveal{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="checkpoint">
  <div class="board" id="board">
    <h1>Point de contrôle</h1>
    <form id="f" autocomplete="off">
      <div class="f"><div class="lbl">Secteur 1</div>
        <div class="line" data-pattern="_______ DE ______" data-words="s1a s1b"></div>
      </div>
      <div class="f"><div class="lbl">Secteur 2</div>
        <div class="line" data-pattern="________-LE-_____" data-words="s2a s2b"></div>
      </div>
      <div class="f"><div class="lbl">Date</div>
        <div class="line" data-pattern="__/__/2026" data-words="dd dm"></div>
      </div>
      <div class="f"><div class="lbl">Objectif</div>
        <div class="line" data-pattern="__ ______" data-words="o1 o2"></div>
      </div>
      <button id="go" type="submit" disabled>Valider</button>
      <p class="msg" id="msg" aria-live="polite"></p>
    </form>
  </div>
</div>
<div id="launch" role="dialog" aria-modal="true" aria-label="La surprise se dévoile" tabindex="-1" hidden>
  <div class="launch-backdrop" aria-hidden="true"></div>
  <div class="start-sequence" aria-hidden="true">
    <p class="start-eyebrow">Le grand moment</p>
    <h2 class="start-title">Tout commence ici.</h2>
    <div class="start-lights" id="lights"><span class="light-column"><i></i><i></i></span><span class="light-column"><i></i><i></i></span><span class="light-column"><i></i><i></i></span><span class="light-column"><i></i><i></i></span><span class="light-column"><i></i><i></i></span></div>
    <p class="start-caption">Retiens ton souffle.</p>
  </div>
  <div class="race-stage" aria-hidden="true">
    <div class="race-wordmark">R-ace <span>GP</span></div>
    <div class="vehicle-frame" id="vehicle-frame">
      <img class="vehicle-photo" id="vehicle-photo" src="assets/f4-race-inside.png" width="1086" height="840" alt="">
      <img class="vehicle-silhouette" id="vehicle-silhouette" src="assets/f4-cutout.png" width="1086" height="840" alt="">
    </div>
    <div class="race-caption"><p>La surprise prend vie.</p><h2>Joyeux <span>anniversaire.</span></h2></div>
  </div>
</div>
<div id="reveal" hidden></div>

const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
async function kdf(pw){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(S.salt), iterations:S.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function open(key, blob){
  const b = b64(blob);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, key, b.slice(12)));
}
async function unwrap(field, answer){
  const key = await kdf(norm(answer));
  for (const w of S.fields[field]) { try { return await open(key, w); } catch (e) {} }
  return null;
}
const $ = id => document.getElementById(id);
const WORDS = ["s1a","s1b","s2a","s2b","dd","dm","o1","o2"];
const words = {};   // id -> {grp, boxes, secret}
let boxes = [];
document.querySelectorAll(".line").forEach((line, li) => {
  const pat = line.dataset.pattern, ids = line.dataset.words.split(" "); let wi = 0, n = 0;
  let grp = null, fixed = "";
  const newGrp = () => { grp = document.createElement("span"); grp.className = "grp"; line.appendChild(grp); };
  const flush = () => { if (!fixed) return; const f = document.createElement("span"); f.className = "fx" + (/^[-\/]$/.test(fixed) ? " sep" : ""); f.textContent = fixed; grp.appendChild(f); fixed = ""; };
  newGrp();
  for (const ch of pat) {
    if (ch === "_") {
      flush();
      if (!grp.dataset.word) { grp.dataset.word = ids[wi++]; words[grp.dataset.word] = {grp, boxes: [], secret: null}; }
      const b = document.createElement("input"); b.className = "box"; b.maxLength = 1;
      b.inputMode = /^[\d_\/]*$/.test(pat) ? "numeric" : "text";
      b.autocapitalize = "characters"; b.spellcheck = false; b.setAttribute("aria-label", "lettre");
      b.id = "b" + li + "_" + (n++); b.dataset.word = grp.dataset.word;
      grp.appendChild(b); boxes.push(b); words[grp.dataset.word].boxes.push(b);
    } else if (ch === " ") {
      flush(); const g = document.createElement("span"); g.className = "gap"; line.appendChild(g); newGrp();
    } else {
      fixed += ch;
      if (/[-\/]/.test(ch)) { flush(); newGrp(); }
    }
  }
  flush();
});
const nextFree = (i, dir) => { let k = i + dir; while (boxes[k] && boxes[k].readOnly) k += dir; return boxes[k]; };
const wordValue = w => words[w].boxes.map(b => b.value || "?").join("");
const allOk = () => WORDS.every(w => words[w].secret);
let submitting = false;
const refreshButton = () => { $("go").disabled = submitting || !allOk(); $("msg").textContent = allOk() ? "Tous les secteurs sont verts." : ""; $("msg").className = "msg"; };
async function checkWord(w){
  const W = words[w];
  if (W.checking || W.secret || W.boxes.some(b => !b.value)) return;
  W.checking = true;
  const lock = on => W.boxes.forEach(b => { b.readOnly = on; b.tabIndex = on ? -1 : 0; });
  lock(true);
  const nb = nextFree(boxes.indexOf(W.boxes[W.boxes.length - 1]), 1); if (nb) nb.focus();
  const secret = await unwrap(w, wordValue(w));
  W.checking = false;
  if (secret) {
    W.secret = secret; W.grp.classList.remove("bad"); W.grp.classList.add("ok");
  } else {
    lock(false); W.grp.classList.add("bad");
  }
  refreshButton();
}
boxes.forEach((b, i) => {
  const W = () => words[b.dataset.word];
  b.addEventListener("focus", () => {
    if (b.readOnly) return;
    W().grp.classList.remove("bad");
    // clicking on a filled letter clears it and everything after it in the word, then filling resumes from here
    const wb = W().boxes, k = wb.indexOf(b);
    if (b.value) wb.slice(k).forEach(x => x.value = "");
    b.select();
  });
  b.addEventListener("input", () => {
    if (b.readOnly) return;
    W().grp.classList.remove("bad");
    b.value = b.value.replace(/[^\p{L}\p{N}]/gu, "").slice(-1).toUpperCase();
    if (b.value) { const nb = nextFree(i, 1); if (nb && nb.dataset.word === b.dataset.word) nb.focus(); }
    checkWord(b.dataset.word);
  });
  b.addEventListener("keydown", e => {
    if (b.readOnly) return;
    if (e.key === "Backspace" && !b.value) { const pb = nextFree(i, -1); if (pb) { pb.focus(); pb.value = ""; words[pb.dataset.word].grp.classList.remove("bad"); } e.preventDefault(); }
    if (e.key === "ArrowLeft") { const pb = nextFree(i, -1); if (pb) pb.focus(); e.preventDefault(); }
    if (e.key === "ArrowRight") { const nb = nextFree(i, 1); if (nb) nb.focus(); e.preventDefault(); }
  });
  b.addEventListener("paste", e => {
    const t = (e.clipboardData.getData("text") || "").replace(/[^\p{L}\p{N}]/gu, "").toUpperCase();
    if (!t) return; e.preventDefault();
    let k = i; const touched = new Set();
    for (const ch of t) { while (boxes[k] && boxes[k].readOnly) k++; if (!boxes[k]) break; boxes[k].value = ch; touched.add(boxes[k].dataset.word); k++; }
    touched.forEach(w => checkWord(w));
    (nextFree(k - 1, 1) || boxes[boxes.length - 1]).focus();
  });
});
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!allOk() || submitting) return;
  const btn = $("go"), msg = $("msg");
  submitting = true;
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Ouverture…";
  $("f").setAttribute("aria-busy", "true");
  try {
    const ikm = new Uint8Array(WORDS.flatMap(w => [...words[w].secret]));
    const base = await crypto.subtle.importKey("raw", ikm, "HKDF", false, ["deriveKey"]);
    const master = await crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:b64(S.salt), info:enc.encode("reveal")}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const p = JSON.parse(new TextDecoder().decode(await open(master, S.payload)));
    await revealWithLaunch(p);
  } catch (e) {
    resetLaunch();
    msg.className = "msg bad"; msg.textContent = "Erreur d'ouverture. Réessaie.";
    submitting = false; btn.disabled = !allOk();
  } finally { $("f").removeAttribute("aria-busy"); }
});
// FIA B5.7.2: one second between red lights; the final hold is not a fixed countdown.
const START_TIMING = {firstLight:900, lightInterval:1000, minimumHold:1200, holdVariation:1600, photoDelay:1450, zoomDuration:4800, landingDuration:1100};
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
function resetLaunch(){
  const scene = $("launch");
  scene.hidden = true;
  scene.className = "";
  scene.querySelectorAll(".light-column").forEach(lamp => lamp.classList.remove("on"));
  scene.getAnimations({subtree:true}).forEach(animation => animation.cancel());
  $("vehicle-frame").removeAttribute("style");
  $("checkpoint").inert = false;
  $("reveal").inert = false;
  document.body.classList.remove("is-launching", "reveal-landing");
}
async function revealWithLaunch(p){
  const html = buildReveal(p);
  const scene = $("launch"), frame = $("vehicle-frame");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Decode the actual photographs before the first light so the reveal never waits on an image.
  await Promise.race([
    Promise.all([$("vehicle-photo").decode(), $("vehicle-silhouette").decode()]),
    new Promise((_, reject) => setTimeout(() => reject(new Error("Image loading timed out")), 8000))
  ]);
  $("checkpoint").inert = true;
  $("reveal").inert = true;
  scene.hidden = false;
  scene.focus({preventScroll:true});
  document.body.classList.add("is-launching");
  await nextFrame();
  scene.classList.add("is-visible");
  if (reduced){
    render(p, html);
    resetLaunch();
    $("reveal-title").focus({preventScroll:true});
    return;
  }
  await pause(START_TIMING.firstLight);
  const lamps = [...scene.querySelectorAll(".light-column")];
  for (let i = 0; i < lamps.length; i++){
    lamps[i].classList.add("on");
    if (i < lamps.length - 1) await pause(START_TIMING.lightInterval);
  }
  await pause(START_TIMING.minimumHold + Math.random() * START_TIMING.holdVariation);
  lamps.forEach(lamp => lamp.classList.remove("on"));
  await pause(220);
  scene.classList.add("has-car");
  const zoom = frame.animate([
    {transform:"translate(-50%,-55%) scale(.72)"},
    {transform:"translate(-50%,-55%) scale(1.06)"}
  ], {duration:START_TIMING.zoomDuration, easing:"cubic-bezier(.25,.1,.25,1)", fill:"forwards"});
  await pause(START_TIMING.photoDelay);
  scene.classList.add("has-photo");
  await zoom.finished;
  // Keep one photograph on screen as it settles into the supplied reveal page.
  const from = frame.getBoundingClientRect();
  render(p, html);
  document.body.classList.add("reveal-landing");
  await nextFrame();
  const target = document.querySelector("#reveal .hero-photo").getBoundingClientRect();
  zoom.cancel();
  Object.assign(frame.style, {left:from.left+"px", top:from.top+"px", width:from.width+"px", height:from.height+"px", aspectRatio:"auto", transform:"none"});
  scene.classList.add("is-landing");
  const landing = frame.animate([
    {left:from.left+"px", top:from.top+"px", width:from.width+"px", height:from.height+"px"},
    {left:target.left+"px", top:target.top+"px", width:target.width+"px", height:target.height+"px"}
  ], {duration:START_TIMING.landingDuration, easing:"cubic-bezier(.22,1,.36,1)", fill:"forwards"});
  await landing.finished;
  resetLaunch();
  $("reveal-title").focus({preventScroll:true});
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function buildReveal(p){
  const convo = p.convocation.map(([k, v], i) => `<div class="row${i === 0 ? " big" : ""}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");
  const stats = p.programme.map(([n, u, d]) => `<div class="stat"><div class="n">${esc(n)}</div><div class="u">${esc(u)}</div><div class="d">${esc(d)}</div></div>`).join("");
  const chips = p.sensations.map(s => `<span class="chip">${esc(s)}</span>`).join("");
  const strip = Array(6).fill(`${esc(p.hero.kicker)} &nbsp;·&nbsp; Formule 4 &nbsp;·&nbsp; 23 . 10 . 2026 &nbsp;·&nbsp; `).join("");
  return `
    <div class="hero"><div class="in">
      <p class="kicker">${esc(p.hero.kicker)}</p>
      <h2 id="reveal-title" tabindex="-1">${esc(p.hero.title)}</h2>
      <p>${esc(p.hero.sub)}</p>
      <div class="carwrap"><img class="hero-photo" src="assets/f4-race-inside.png" width="1086" height="840" alt="La Formule 4 R-ace Inside sur le circuit"></div>
    </div></div>
    <div class="strip"><span>${strip}</span></div>
    <main><div class="in">
      <section><h3>Convocation</h3><div class="convo">${convo}</div></section>
      <section><h3>Au programme</h3><div class="stats">${stats}</div></section>
      <section><h3>Autre châssis, autres sensations</h3><div class="chips">${chips}</div></section>
      <section><h3>L'écurie</h3><p class="ecurie">${esc(p.ecurie)}</p></section>
      <section><div class="closing"><p class="note">Ceinture, casque. Bon anniversaire Rafi !</p><a class="cta" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.cta)}</a></div></section>
    </div></main>
    <footer>Point de contrôle franchi</footer>`;
}

function render(p, html = buildReveal(p)){
  $("checkpoint").hidden = true;
  document.body.classList.add("reveal-mode");
  const reveal = $("reveal");
  reveal.innerHTML = html;
  reveal.hidden = false;
  window.scrollTo({top:0, behavior:"instant"});
  requestAnimationFrame(() => reveal.classList.add("in"));
}
</script>
